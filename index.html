<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow - Gestión de Tareas</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>TaskFlow</h1>

      <form id="task-form">
        <input
          type="text"
          id="task-title"
          placeholder="Título de la tarea"
          required
        />
        <button type="submit">Agregar Tarea</button>
      </form>

      <div class="actions">
        <button id="fetch-api-btn">Cargar tareas desde API externa</button>
      </div>

      <ul id="task-list"></ul>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
